<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F5F5FA" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0D0D1A" media="(prefers-color-scheme: dark)" />
<title>WitBlitz</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<style>
  @font-face {
    font-family: "Space Grotesk";
    src: url("/assets/fonts/SpaceGrotesk-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Space Grotesk";
    src: url("/assets/fonts/SpaceGrotesk-Medium.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Space Grotesk";
    src: url("/assets/fonts/SpaceGrotesk-Bold.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: swap;
  }
  /* The app's own tokens, as on the home page. */
  :root {
    --paper: #F5F5FA;
    --surface: #FFFFFF;
    --ink: #1A1A2E;
    --muted: #6B6B8D;
    --line: #E0E0EB;
    --glow: #00BCD4;
    --glow-text: #00838F;
    --glow-tint: rgba(0, 188, 212, 0.10);
    --coral: #E94560;
    --btn-bg: #1A1A2E;
    --btn-text: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0D0D1A;
      --surface: #1A1A2E;
      --ink: #F5F5FA;
      --muted: #9B9BB5;
      --line: #2D2D45;
      --glow-text: #00BCD4;
      --glow-tint: rgba(0, 188, 212, 0.14);
      --coral: #FF6B81;
      --btn-bg: #F5F5FA;
      --btn-text: #0D0D1A;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; border-radius: 6px; }
  .wrap { width: 100%; max-width: 420px; }
  .top { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
  .top img { width: 40px; height: 40px; border-radius: 10px; display: block; }
  .top .name { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .line { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--glow), var(--coral)); margin: 0 0 28px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 26px 22px 22px;
  }
  .invited { font-size: 28px; line-height: 1.08; letter-spacing: -0.03em; font-weight: 700; margin: 0 0 18px; }
  .codelabel { color: var(--muted); font-size: 15px; font-weight: 500; margin: 0 0 8px; }
  .coderow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 24px; }
  .code {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: var(--glow-text);
    background: var(--glow-tint);
    border: 1.5px solid var(--glow);
    border-radius: 12px;
    padding: 8px 12px 8px 16px;
    user-select: all;
    -webkit-user-select: all;
  }
  .copy {
    background: none;
    border: 0;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 12px 8px;
    cursor: pointer;
  }
  .btn {
    display: block;
    background: var(--btn-bg);
    color: var(--btn-text);
    text-align: center;
    text-decoration: none;
    font-size: 17px;
    font-weight: 700;
    padding: 16px 20px;
    border-radius: 12px;
    margin: 0 0 14px;
  }
  .hint { color: var(--muted); font-size: 15px; margin: 0 0 10px; }
  .alt { display: inline-block; color: var(--ink); font-size: 16px; font-weight: 700; padding: 10px 0; text-underline-offset: 3px; }
  .nf { color: var(--muted); font-size: 17px; margin: 0; }
  .nf a { color: var(--ink); font-weight: 700; text-underline-offset: 3px; }
</style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script>
    (function () {
      var appStore = 'https://apps.apple.com/app/id6761444213';
      var webApp = 'https://play.witblitz.app';
      var app = document.getElementById('app');

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }
      function link(cls, text, href) {
        var a = el('a', cls, text);
        a.href = href;
        return a;
      }
      function header() {
        var top = el('div', 'top');
        var img = document.createElement('img');
        img.src = '/assets/icon-192.png';
        img.alt = '';
        img.width = 40;
        img.height = 40;
        top.appendChild(img);
        top.appendChild(el('p', 'name', 'WitBlitz'));
        return top;
      }
      // An iPhone, an iPod touch, or an iPad (iPadOS reports itself as a Mac
      // with a touch screen).
      function isAppleTouchDevice() {
        var ua = navigator.userAgent || '';
        if (/iPhone|iPad|iPod/i.test(ua)) return true;
        return /Macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1;
      }

      app.appendChild(header());
      app.appendChild(el('div', 'line'));

      var m = (location.pathname || '').match(/^\/join\/([^\/?#]+)/i);
      var code = '';
      if (m && m[1]) {
        try {
          code = decodeURIComponent(m[1]);
        } catch (e) {
          code = '';
        }
        // Stray punctuation from a pasted message is dropped. A real code is
        // six letters and digits; anything far from that is not an invite.
        code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (code.length < 4 || code.length > 12) code = '';
      }

      if (!code) {
        var nf = el('p', 'nf', 'Page not found. ');
        nf.appendChild(link('', 'Go to the home page', '/'));
        app.appendChild(nf);
        return;
      }

      var playUrl = webApp + '/join/' + encodeURIComponent(code);
      var onApple = isAppleTouchDevice();

      var card = el('div', 'card');
      card.appendChild(el('h1', 'invited', 'You’re invited to a WitBlitz group.'));
      card.appendChild(el('p', 'codelabel', 'Your code'));

      var row = el('div', 'coderow');
      row.appendChild(el('span', 'code', code));
      // Shown only where copying can work; the code stays selectable either way.
      if (navigator.clipboard && navigator.clipboard.writeText) {
        var copy = el('button', 'copy', 'Copy code');
        copy.type = 'button';
        copy.addEventListener('click', function () {
          navigator.clipboard.writeText(code).then(function () {
            copy.textContent = 'Copied';
            setTimeout(function () { copy.textContent = 'Copy code'; }, 2000);
          }, function () {});
        });
        row.appendChild(copy);
      }
      card.appendChild(row);

      if (onApple) {
        card.appendChild(link('btn', 'Get WitBlitz on the App Store', appStore));
        card.appendChild(el('p', 'hint', 'Already have the app? Go back to your message and tap the link again.'));
        card.appendChild(link('alt', 'Or play free in your browser', playUrl));
      } else {
        card.appendChild(link('btn', 'Play free in your browser', playUrl));
        card.appendChild(el('p', 'hint', 'Create a free account and you’ll join the group with this code.'));
        card.appendChild(link('alt', 'On an iPhone? Get the app', appStore));
      }

      app.appendChild(card);
      document.title = 'Join a WitBlitz group: ' + code;
    })();
  </script>
</body>
</html>
