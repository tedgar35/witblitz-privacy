<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>WitBlitz</title>
<style>
  :root {
    --bg: #1A1A2E;
    --card: #16213E;
    --accent: #E94560;
    --text: #FFFFFF;
    --muted: #B8BCC8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 420px; text-align: center; }
  .wordmark { font-size: 34px; font-weight: 800; letter-spacing: 0.5px; margin: 0 0 6px; }
  .wordmark .spark { color: var(--accent); }
  .tag { color: var(--muted); font-size: 15px; margin: 0 0 28px; }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 28px 22px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }
  .invited { font-size: 19px; font-weight: 700; margin: 0 0 6px; }
  .codelabel { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .code {
    display: inline-block;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--accent);
    background: rgba(233, 69, 96, 0.12);
    border: 1px solid rgba(233, 69, 96, 0.4);
    border-radius: 12px;
    padding: 10px 18px;
    margin: 0 0 8px;
    user-select: all;
    -webkit-user-select: all;
  }
  .copy {
    display: block;
    margin: 0 auto 22px;
    background: none;
    border: 0;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    text-decoration: underline;
    padding: 10px 12px;
    cursor: pointer;
  }
  .btn {
    display: block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 17px;
    font-weight: 700;
    padding: 15px 20px;
    border-radius: 14px;
    margin: 0 0 16px;
  }
  .hint { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 14px; }
  .alt { display: inline-block; color: var(--text); font-size: 15px; font-weight: 600; padding: 10px 12px; }
  .btn:focus-visible, .alt:focus-visible, .copy:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .nf { color: var(--muted); font-size: 16px; }
  .nf a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script>
    (function () {
      var appStore = 'https://apps.apple.com/app/id6761444213';
      var webApp = 'https://play.witblitz.app';
      var app = document.getElementById('app');

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }
      function link(cls, text, href) {
        var a = el('a', cls, text);
        a.href = href;
        return a;
      }
      function wordmark() {
        var h = el('h1', 'wordmark', 'Wit');
        h.appendChild(el('span', 'spark', 'Blitz'));
        return h;
      }
      // An iPhone, an iPod touch, or an iPad (iPadOS reports itself as a Mac
      // with a touch screen).
      function isAppleTouchDevice() {
        var ua = navigator.userAgent || '';
        if (/iPhone|iPad|iPod/i.test(ua)) return true;
        return /Macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1;
      }

      app.appendChild(wordmark());

      var m = (location.pathname || '').match(/^\/join\/([^\/?#]+)/i);
      var code = '';
      if (m && m[1]) {
        try {
          code = decodeURIComponent(m[1]);
        } catch (e) {
          code = '';
        }
        // Stray punctuation from a pasted message is dropped. A real code is
        // six letters and digits; anything far from that is not an invite.
        code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (code.length < 4 || code.length > 12) code = '';
      }

      if (!code) {
        var nf = el('p', 'nf', 'Page not found. ');
        nf.appendChild(link('', 'Go home', '/'));
        app.appendChild(nf);
        return;
      }

      var playUrl = webApp + '/join/' + encodeURIComponent(code);
      var onApple = isAppleTouchDevice();

      app.appendChild(el('p', 'tag', 'Four quick daily games with friends'));

      var card = el('div', 'card');
      card.appendChild(el('p', 'invited', 'You’re invited to a WitBlitz group'));
      card.appendChild(el('p', 'codelabel', 'Your code'));
      card.appendChild(el('div', 'code', code));

      var copy = el('button', 'copy', 'Copy code');
      copy.type = 'button';
      copy.addEventListener('click', function () {
        function done() {
          copy.textContent = 'Copied';
          setTimeout(function () { copy.textContent = 'Copy code'; }, 2000);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(done, function () {});
        }
      });
      // Shown only where copying can work; the code stays selectable either way.
      if (navigator.clipboard && navigator.clipboard.writeText) {
        card.appendChild(copy);
      } else {
        card.querySelector('.code').style.marginBottom = '24px';
      }

      if (onApple) {
        card.appendChild(link('btn', 'Get WitBlitz on the App Store', appStore));
        card.appendChild(el('p', 'hint', 'Already have the app? Go back to your message and tap the link again.'));
        card.appendChild(link('alt', 'Or play free in your browser', playUrl));
      } else {
        card.appendChild(link('btn', 'Play free in your browser', playUrl));
        card.appendChild(el('p', 'hint', 'Create a free account and you’ll join the group with this code.'));
        card.appendChild(link('alt', 'On an iPhone? Get the app', appStore));
      }

      app.appendChild(card);
      document.title = 'Join a WitBlitz group: ' + code;
    })();
  </script>
</body>
</html>
