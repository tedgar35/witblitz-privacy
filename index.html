<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WitBlitz: four quick daily games with friends</title>
<meta name="description" content="WitBlitz: four quick daily games (trivia, words and puzzles) with friends. Free on the iPhone App Store and in any browser." />
<meta name="apple-itunes-app" content="app-id=6761444213" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://witblitz.app/" />
<meta property="og:title" content="WitBlitz: four quick daily games with friends" />
<meta property="og:description" content="Trivia, words and puzzles, with friends. Free on the iPhone App Store and in any browser." />
<style>
  :root {
    --bg: #1A1A2E;
    --card: #16213E;
    --accent: #E94560;
    --text: #FFFFFF;
    --muted: #B8BCC8;
    --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 56px 24px 40px;
    text-align: center;
  }
  .wordmark { font-size: 44px; font-weight: 800; letter-spacing: 0.5px; margin: 0 0 10px; }
  .wordmark .spark { color: var(--accent); }
  .tag { color: var(--muted); font-size: 18px; margin: 0 0 36px; }
  .games {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 0 0 36px;
  }
  .game {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 14px;
  }
  .game .emoji { font-size: 32px; display: block; margin-bottom: 8px; }
  .game .name { font-size: 15px; font-weight: 700; }
  .cta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 0 0 14px;
  }
  .store { display: inline-block; line-height: 0; padding: 14px; margin: -14px; }
  .store img { height: 54px; width: auto; display: block; }
  .play {
    display: inline-block;
    color: #fff;
    background: var(--accent);
    border-radius: 12px;
    padding: 0 22px;
    height: 54px;
    line-height: 54px;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }
  .play:focus-visible, .store:focus-visible, footer a:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }
  .note { color: var(--muted); font-size: 15px; margin: 0 0 40px; }
  footer { color: var(--muted); font-size: 14px; border-top: 1px solid var(--border); padding-top: 24px; }
  footer a { color: var(--accent); text-decoration: none; }
  @media (max-width: 360px) {
    .games { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <h1 class="wordmark">Wit<span class="spark">Blitz</span></h1>
    <p class="tag">Four quick daily games: trivia, words and puzzles, with friends.</p>

    <section class="games" aria-label="The four daily games">
      <div class="game"><span class="emoji">🧠</span><span class="name">Trivia Bolt</span></div>
      <div class="game"><span class="emoji">🔤</span><span class="name">Letter Blitz</span></div>
      <div class="game"><span class="emoji">🪜</span><span class="name">Word Ladder</span></div>
      <div class="game"><span class="emoji">🔢</span><span class="name">Mini Sudoku</span></div>
    </section>

    <div class="cta">
      <a class="store" href="https://apps.apple.com/app/id6761444213" aria-label="Download WitBlitz on the App Store">
        <img src="/assets/download-on-the-app-store.svg" alt="Download on the App Store" width="162" height="54" />
      </a>
      <a class="play" href="https://play.witblitz.app/">Play free in your browser</a>
    </div>
    <p class="note">Free on iPhone and in any browser.</p>

    <footer>
      <a href="/privacy/">Privacy Policy</a>
      <span aria-hidden="true"> &middot; </span>
      <a href="https://witblitz.app/terms">Terms of Service</a>
    </footer>
  </main>
</body>
</html>
